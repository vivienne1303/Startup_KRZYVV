 a bilingual platform and community helping teenagers aged 10-24 discover opportunities in innovation, entrepreneurship, communication, and personal development.\"\u003e\n          TeenLaunch is a bilingual platform and community helping teenagers aged 10-24 discover opportunities in innovation, entrepreneurship, communication, and personal development.\n        \u003c/p\u003e\n        \u003cdiv class=\"hero-actions\"\u003e\n          \u003ca class=\"btn primary\" href=\"pages/opportunities.html\" data-i18n=\"Get Started\"\u003eGet Started\u003c/a\u003e\n          \u003ca class=\"btn secondary\" href=\"#featured\" data-i18n=\"Explore Platform\"\u003eExplore Platform\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003ca class=\"chat-preview reveal\" href=\"pages/aiassistant.html\" aria-label=\"Open TeenLaunch AI assistant\"\u003e\n        \u003cdiv class=\"chat-top\"\u003e\n          \u003cspan class=\"pulse\"\u003e\u003c/span\u003e\n          \u003cstrong data-i18n=\"TeenLaunch AI\"\u003eTeenLaunch AI\u003c/strong\u003e\n          \u003csmall data-i18n=\"online\"\u003eonline\u003c/small\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"message ai\" data-i18n=\"What kind of opportunity are you looking for?\"\u003eWhat kind of opportunity are you looking for?\u003c/div\u003e\n        \u003cdiv class=\"message user\" data-i18n=\"Beginner startup programmes for a 15-year-old.\"\u003eBeginner startup programmes for a 15-year-old.\u003c/div\u003e\n        \u003cdiv class=\"message ai\" data-i18n=\"I found startup camps, pitch competitions, and a workshop with July deadlines.\"\u003eI found startup camps, pitch competitions, and a workshop with July deadlines.\u003c/div\u003e\n        \u003cdiv class=\"chat-input\" data-i18n=\"Ask about opportunities, skills, competitions...\"\u003eAsk about opportunities, skills, competitions...\u003c/div\u003e\n      \u003c/a\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section split-section\" id=\"problem\"\u003e\n      \u003cdiv class=\"section-heading reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"The problem\"\u003eThe problem\u003c/p\u003e\n        \u003ch2 data-i18n=\"Many teenagers do not know where to find growth opportunities beyond academics.\"\u003eMany teenagers do not know where to find growth opportunities beyond academics.\u003c/h2\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"action-list reveal\"\u003e\n        \u003cdiv data-i18n=\"Opportunities such as startup initiatives, competitions, leadership workshops, debate platforms, internships, and skill-building resources exist, but they are often difficult to find.\"\u003eOpportunities such as startup initiatives, competitions, leadership workshops, debate platforms, internships, and skill-building resources exist, but they are often difficult to find.\u003c/div\u003e\n        \u003cdiv data-i18n=\"Information is poorly organised and not always communicated clearly to students, so many teenagers miss valuable chances to grow.\"\u003eInformation is poorly organised and not always communicated clearly to students, so many teenagers miss valuable chances to grow.\u003c/div\u003e\n        \u003cdiv data-i18n=\"Many students lack confidence in soft skills such as communication, critical thinking, articulation, negotiation, and problem solving.\"\u003eMany students lack confidence in soft skills such as communication, critical thinking, articulation, negotiation, and problem solving.\u003c/div\u003e\n        \u003cdiv data-i18n=\"Without early exposure, youths may not explore their full potential or prepare for future career pathways and innovation-driven industries.\"\u003eWithout early exposure, youths may not explore their full potential or prepare for future career pathways and innovation-driven industries.\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section split-section\" id=\"solution\"\u003e\n      \u003cdiv class=\"section-heading reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"Our solution\"\u003eOur solution\u003c/p\u003e\n        \u003ch2 data-i18n=\"A bilingual youth-focused platform that brings everything together in one place.\"\u003eA bilingual youth-focused platform that brings everything together in one place.\u003c/h2\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"action-list reveal\"\u003e\n        \u003cdiv data-i18n=\"Information about internship, job shadowing, and work opportunities.\"\u003eInformation about internship, job shadowing, and work opportunities.\u003c/div\u003e\n        \u003cdiv data-i18n=\"Clear context for programmes, competitions, leadership workshops, and entrepreneurship experiences.\"\u003eClear context for programmes, competitions, leadership workshops, and entrepreneurship experiences.\u003c/div\u003e\n        \u003cdiv data-i18n=\"Resources for career exploration, future development, innovation, and entrepreneurship.\"\u003eResources for career exploration, future development, innovation, and entrepreneurship.\u003c/div\u003e\n        \u003cdiv data-i18n=\"Debate, negotiation, communication, and soft-skill development tools.\"\u003eDebate, negotiation, communication, and soft-skill development tools.\u003c/div\u003e\n        \u003cdiv data-i18n=\"A safe and supportive community where teenagers can learn, collaborate, and grow.\"\u003eA safe and supportive community where teenagers can learn, collaborate, and grow.\u003c/div\u003e\n        \u003cdiv data-i18n=\"AI chatbot assistance to help users find opportunities, competitions, resources, and learning materials faster.\"\u003eAI chatbot assistance to help users find opportunities, competitions, resources, and learning materials faster.\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section split-section\" id=\"mission\"\u003e\n      \u003cdiv class=\"section-heading reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"Purpose, goals, and vision\"\u003ePurpose, goals, and vision\u003c/p\u003e\n        \u003ch2 data-i18n=\"Bridge the gap between education and real-world opportunities.\"\u003eBridge the gap between education and real-world opportunities.\u003c/h2\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"action-list reveal\"\u003e\n        \u003cdiv\u003e\n          \u003cstrong data-i18n=\"Our Purpose\"\u003eOur Purpose\u003c/strong\u003e\n          \u003cp data-i18n=\"Help teenagers discover and access competitions, programmes, internships, and entrepreneurial experiences while encouraging active learning, innovation, and personal growth.\"\u003eHelp teenagers discover and access competitions, programmes, internships, and entrepreneurial experiences while encouraging active learning, innovation, and personal growth.\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong data-i18n=\"Our Goals\"\u003eOur Goals\u003c/strong\u003e\n          \u003cp data-i18n=\"Increase awareness of youth opportunities, develop critical thinking, communication, leadership, and problem-solving skills, and provide resources, guidance, and community support.\"\u003eIncrease awareness of youth opportunities, develop critical thinking, communication, leadership, and problem-solving skills, and provide resources, guidance, and community support.\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong data-i18n=\"Our Vision\"\u003eOur Vision\u003c/strong\u003e\n          \u003cp data-i18n=\"Empower teenagers to become confident, future-ready individuals who take initiative, pursue their passions, and create meaningful impact.\"\u003eEmpower teenagers to become confident, future-ready individuals who take initiative, pursue their passions, and create meaningful impact.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!--\n    \u003csection class=\"section\" id= brow\" data-i18n=\"Soft Skills \u0026 Debate\"\u003eSoft Skills \u0026 Debate\u003c/p\u003e\n        \u003ch1 data-i18n=\"Speak. Think. Lead.\"\u003eSpeak. Think. Lead.\u003c/h1\u003e\n        \u003cp data-i18n=\"Build arguments, practice rebuttals, sharpen critical thinking, and grow into the kind of speaker people remember.\"\u003eBuild arguments, practice rebuttals, sharpen critical thinking, and grow into the kind of speaker people remember.\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"timer-card reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"Debate timer\"\u003eDebate timer\u003c/p\u003e\n        \u003cdiv class=\"timer-display\" id=\"timerDisplay\"\u003e03:00\u003c/div\u003e\n        \u003clabel\u003e\u003cspan data-i18n=\"Speech minutes\"\u003eSpeech minutes\u003c/span\u003e \u003cinput id=\"minutesInput\" type=\"number\" min=\"1\" max=\"8\" value=\"3\"\u003e\u003c/label\u003e\n        \u003clabel\u003e\u003cspan data-i18n=\"Speaker round\"\u003eSpeaker round\u003c/span\u003e \u003cselect id=\"roundSelect\"\u003e\u003coption data-i18n=\"Prime Minister\"\u003ePrime Minister\u003c/option\u003e\u003coption data-i18n=\"Opposition Leader\"\u003eOpposition Leader\u003c/option\u003e\u003coption data-i18n=\"Rebuttal Speaker\"\u003eRebuttal Speaker\u003c/option\u003e\u003coption data-i18n=\"Reply Speech\"\u003eReply Speech\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\n        \u003cdiv class=\"timer-actions\"\u003e\n          \u003cbutton class=\"btn primary\" id=\"startTimer\" data-i18n=\"Start\"\u003eStart\u003c/button\u003e\n          \u003cbutton class=\"btn secondary\" id=\"pauseTimer\" data-i18n=\"Pause\"\u003ePause\u003c/button\u003e\n          \u003cbutton class=\"btn secondary\" id=\"resetTimer\" data-i18n=\"Reset\"\u003eReset\u003c/button\u003e\n        \u003c/div\u003e\n        \u003cp class=\"mode-label\" id=\"modeLabel\" data-i18n=\"Practice mode ready.\"\u003ePractice mode ready.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section\"\u003e\n      \u003cdiv class=\"section-heading reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"Learn the craft\"\u003eLearn the craft\u003c/p\u003e\n        \u003ch2 data-i18n=\"Training blocks for stronger thinking, speaking, and leadership.\"\u003eTraining blocks for stronger thinking, speaking, and leadership.\u003c/h2\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"skill-grid\"\u003e\n        \u003carticle class=\"skill reveal\"\u003e\u003ch3 data-i18n=\"Debate Basics\"\u003eDebate Basics\u003c/h3\u003e\u003cp data-i18n=\"Learn roles, structures, motions, points of information, and speaker duties.\"\u003eLearn roles, structures, motions, points of information, and speaker duties.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"skill reveal\"\u003e\u003ch3 data-i18n=\"Argument Building\"\u003eArgument Building\u003c/h3\u003e\u003cp data-i18n=\"Use claim, reason, evidence, impact, and link-back to make points land.\"\u003eUse claim, reason, evidence, impact, and link-back to make points land.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"skill reveal\"\u003e\u003ch3 data-i18n=\"Rebuttal Techniques\"\u003eRebuttal Techniques\u003c/h3\u003e\u003cp data-i18n=\"Spot weak assumptions, compare impacts, and respond without sounding defensive.\"\u003eSpot weak assumptions, compare impacts, and respond without sounding defensive.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"skill reveal\"\u003e\u003ch3 data-i18n=\"Public Speaking Tips\"\u003ePublic Speaking Tips\u003c/h3\u003e\u003cp data-i18n=\"Use pacing, pauses, posture, voice, and eye contact to sound confident.\"\u003eUse pacing, pauses, posture, voice, and eye contact to sound confident.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"skill reveal\"\u003e\u003ch3 data-i18n=\"Critical Thinking Exercises\"\u003eCritical Thinking Exercises\u003c/h3\u003e\u003cp data-i18n=\"Practice weighing trade-offs, challenging assumptions, and ranking arguments.\"\u003ePractice weighing trade-offs, challenging assumptions, and ranking arguments.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"skill reveal\"\u003e\u003ch3 data-i18n=\"Speaking Challenges\"\u003eSpeaking Challenges\u003c/h3\u003e\u003cp data-i18n=\"Complete short daily drills for clarity, confidence, pace, and persuasive delivery.\"\u003eComplete short daily drills for clarity, confidence, pace, and persuasive delivery.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"skill reveal\"\u003e\u003ch3 data-i18n=\"Mock Debate Activities\"\u003eMock Debate Activities\u003c/h3\u003e\u003cp data-i18n=\"Run mini rounds with roles, motions, prep time, speeches, and reflection prompts.\"\u003eRun mini rounds with roles, motions, prep time, speeches, and reflection prompts.\u003c/p\u003e\u003c/article\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section practice-section\"\u003e\n      \u003cdiv class=\"practice-card reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"Practice area\"\u003ePractice area\u003c/p\u003e\n        \u003ch2 id=\"motionText\" data-i18n=\"This house believes schools should teach entrepreneurship.\"\u003eThis house believes schools should teach entrepreneurship.\u003c/h2\u003e\n        \u003cbutton class=\"btn primary\" id=\"newMotion\" data-i18n=\"Generate Random Motion\"\u003eGenerate Random Motion\u003c/button\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"feedback-card reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"AI Feedback Assistant\"\u003eAI Feedback Assistant\u003c/p\u003e\n        \u003cdiv class=\"message\" data-i18n=\"Try giving one clear example after your strongest argument.\"\u003eTry giving one clear example after your strongest argument.\u003c/div\u003e\n        \u003cdiv class=\"message alt\" data-i18n=\"Your rebuttal is stronger when you compare impacts directly.\"\u003eYour rebuttal is stronger when you compare impacts directly.\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section resources-grid\"\u003e\n      \u003carticle class=\"resource reveal\"\u003e\u003ch3 data-i18n=\"Debate Resources\"\u003eDebate Resources\u003c/h3\u003e\u003cp data-i18n=\"Formats, rules, judging criteria, team roles, and sample speeches in one place.\"\u003eFormats, rules, judging criteria, team roles, and sample speeches in one place.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\"resource reveal\"\u003e\u003ch3 data-i18n=\"Debate Topics\"\u003eDebate Topics\u003c/h3\u003e\u003cp data-i18n=\"School-friendly motions about technology, education, climate, media, and leadership.\"\u003eSchool-friendly motions about technology, education, climate, media, and leadership.\u003c/p\u003e\u003c/article\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section progress-grid\"\u003e\n      \u003cdiv class=\"progress reveal\"\u003e\n        \u003cp class=\"eyebrow\" data-i18n=\"Practice time recorder\"\u003ePractice time recorder\u003c/p\u003e\n        \u003ch2 data-i18n=\"Record your speaking practice\"\u003eRecord your speaking practice\u003c/h2\u003e\n        \u003cdiv class=\"practice-stopwatch\" id=\"practiceStopwatch\" role=\"timer\" aria-live=\"off\"\u003e00:00:00\u003c/div\u003e\n        \u003cp class=\"recorder-status\" id=\"recorderStatus\" data-i18n=\"Ready to record.\"\u003eReady to record.\u003c/p\u003e\n        \u003cdiv class=\"timer-actions recorder-actions\"\u003e\n          \u003cbutton class=\"btn primary\" id=\"startRecording\" type=\"button\" data-i18n=\"Start recording\"\u003eStart recording\u003c/button\u003e\n          \u003cbutton class=\"btn secondary\" id=\"saveRecording\" type=\"button\" data-i18n=\"Stop and save\"\u003eStop and save\u003c/button\u003e\n          \u003cbutton class=\"btn secondary\" id=\"resetRecording\" type x.html\" data-i18n=\"Home\"\u003eHome\u003c/a\u003e\n  \u003c/footer\u003e\n  \n  \n\n  \n  \n\u003c/body\u003e\n\u003c/html\u003e\n","name":"site\\pages\\display-settings.html"},{"html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cbase href=\"file:///C:/Users/vivie/OneDrive%20-%20Singapore%20Polytechnic/iphone%20album/Documents/Startup%20KRZYVV/mobile%20app/site/pages/\"\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n\n  \u003ctitle\u003eZong Keren | Meet the Founders | TeenLaunch\u003c/title\u003e\n\n  \u003cmeta name=\"description\" content=\"Meet Zong Keren, Co-founder and Chief Executive Officer of TeenLaunch. Explore her background, aspirations, and what TeenLaunch means to her.\"\u003e\n\n  \u003c!-- Theme Script --\u003e\n  \n\n  \u003c!-- Fonts --\u003e\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n  \u003c!-- Stylesheets --\u003e\n  \u003clink rel=\"stylesheet\" href=\"../style.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/theme.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/founders.css\"\u003e\n\u003clink rel=\"stylesheet\" href=\"../../mobile-pages.css\"\u003e\u003c/head\u003e\n\n\u003cbody\u003e\n\n  \u003c!-- Header --\u003e\n  \u003cheader class=\"site-header\"\u003e\n    \u003cnav class=\"navbar\" aria-label=\"Main navigation\"\u003e\n\n      \u003ca class=\"brand\" href=\"../index.html\"\u003e\n        \u003cimg\n          class=\"brand-logo\"\n          src=\"../assets/images/light_logo.png\"\n          alt=\"TeenLaunch Logo\"\n        \u003e\n        \u003cspan\u003e\n          TeenLaunch\n          \u003csmall\u003eFuture founders start here\u003c/small\u003e\n        \u003c/span\u003e\n      \u003c/a\u003e\n\n      \u003cdiv class=\"nav-links\"\u003e\n        \u003ca href=\"about.html\"\u003eAbout us\u003c/a\u003e\n        \u003ca class=\"auth-link\" href=\"auth.html\"\u003eLogin\u003c/a\u003e\n      \u003c/div\u003e\n\n    \u003c/nav\u003e\n  \u003c/header\u003e\n\n  \u003c!-- Main Content --\u003e\n  \u003cmain class=\"founder-main\"\u003e\n\n    \u003c!-- Back to Founders --\u003e\n    \u003ca class=\"founder-breadcrumb\" href=\"about.html#founders\"\u003e\n      \u0026larr; Meet our founders\n    \u003c/a\u003e\n\n    \u003c!-- Founder Profile --\u003e\n    \u003csection class=\"founder-hero\" aria-labelledby=\"founder-name\"\u003e\n\n      \u003cfigure class=\"founder-portrait\"\u003e\n        \u003cimg\n          src=\"../assets/images/KR pic.png\"\n          alt=\"Portrait of Zong Keren\"\n          width=\"640\"\n          height=\"800\"\n        \u003e\n        \u003cfigcaption\u003eZong Keren\u003c/figcaption\u003e\n      \u003c/figure\u003e\n\n      \u003cdiv\u003e\n        \u003cp class=\"founder-kicker\"\u003e\n          The people behind TeenLaunch\n        \u003c/p\u003e\n\n        \u003ch1 id=\"founder-name\"\u003eZong Keren\u003c/h1\u003e\n\n        \u003cp class=\"founder-role\"\u003e\n          Co-founder \u0026middot; Chief Executive Officer (CEO)\n        \u003c/p\u003e\n\n        \u003cdiv class=\"founder-email\"\u003e\n          \u003cspan\u003eTeenLaunch email\u003c/span\u003e\n          \u003cp\u003e\n            \u003ca href=\"mailto:keren@teenlaunch.app\"\u003e\n              keren@teenlaunch.app\n            \u003c/a\u003e\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n    \u003c/section\u003e\n\n    \u003c!-- Background --\u003e\n    \u003csection class=\"founder-story\" aria-labelledby=\"background-heading\"\u003e\n\n      \u003cp class=\"founder-kicker\"\u003e01 / My story\u003c/p\u003e\n\n      \u003ch2 id=\"background-heading\"\u003e\n        A little about me\n      \u003c/h2\u003e\n\n      \u003cp\u003e\n        I am a student leader and aspiring entrepreneur who is\n        interested in turning ideas into initiatives that create\n        tangible impact. I am particularly drawn to identifying\n        gaps in existing systems and exploring how technology\n        can offer practical solutions to real-world challenges.\n        Through TeenLaunch, I seek to address a challenge faced\n        by many young people: navigating an overwhelming landscape\n        of opportunities without a clear starting point.\n        My approach centres on building a solution that is not\n        only innovative, but also practical, accessible, and\n        capable of creating lasting value.\n      \u003c/p\u003e\n\n    \u003c/section\u003e\n\n    \u003c!-- Present and Future Aspirations --\u003e\n    \u003csection class=\"founder-story\" aria-labelledby=\"aspirations-heading\"\u003e\n\n      \u003cp class=\"founder-kicker\"\u003e02 / Looking ahead\u003c/p\u003e\n\n      \u003ch2 id=\"aspirations-heading\"\u003e\n        What I\u0027m working towards\n      \u003c/h2\u003e\n\n      \u003cdiv class=\"founder-aspirations\"\u003e\n\n        \u003c!-- Present Aspirations --\u003e\n        \u003carticle\u003e\n          \u003cp class=\"founder-kicker\"\u003eRight now\u003c/p\u003e\n\n          \u003ch3\u003ePresent aspirations\u003c/h3\u003e\n\n          \u003cp\u003e\n            As CEO of TeenLaunch, I lead the team in turning\n            our vision into reality, guiding the platform\u0027s\n            direction and working towards making it a\n            sustainable initiative. I hope to grow TeenLaunch\n            into a trusted platform where young people can\n            discover opportunities that match their interests\n            and take meaningful steps towards their goals.\n          \u003c/p\u003e\n        \u003c/article\u003e\n\n        \u003c!-- Future Aspirations --\u003e\n        \u003carticle\u003e\n          \u003cp class=\"founder-kicker\"\u003eThe next chapter\u003c/p\u003e\n\n          \u003ch3\u003eFuture aspirations\u003c/h3\u003e\n\n          \u003cp\u003e\n            Beyond the platform itself, I want TeenLaunch to\n            bring youths and organisations closer together,\n            creating more ways for young people to learn,\n            gain experience, and contribute to society.\n            In the long run, I hope TeenLaunch can help build\n            a culture where young people feel empowered to\n            pursue their ambitions instead of feeling limited\n            by what they already know or have access to.\n          \u003c/p\u003e\n        \u003c/article\u003e\n\n      \u003c/div\u003e\n\n    \u003c/section\u003e\n\n    \u003c!-- Founder Navigation --\u003e\n    \u003cnav class=\"founder-switcher\" aria-label=\"Founder profiles\"\u003e\n\n      \u003ca href=\"founder-keren.html\" aria-current=\"page\"\u003e\n        Keren\n      \u003c/a\u003e\n\n      \u003ca href=\"founder-ziying.html\"\u003e\n        Ziying\n      \u003c/a\u003e\n\n      \u003ca href=\"founder-vivienne.html\"\u003e\n        Vivienne\n      \u003c/a\u003e\n\n    \u003c/nav\u003e\n\n    \u003c!-- What TeenLaunch Means to Me --\u003e\n    \u003csection class=\"founder-answer\" aria-labelledby=\"meaning-heading\"\u003e\n\n      \u003cp class=\"founder-kicker\"\u003e\n        In my own words\n      \u003c/p\u003e\n\n      \u003ch2 id=\"meaning-heading\"\u003e\n        What does TeenLaunch mean to you?\n      \u003c/h2\u003e\n\n      \u003cblockquote\u003e\n        To me, TeenLaunch represents the belief that a young\n        person\u0027s future should not be limited by what they\n        happen to know or who they happen to know.\n\n        There are countless opportunities for young people\n        to learn, grow, and discover their potential, yet\n        many remain out of reach simply because they do not\n        know where to find them. I want TeenLaunch to change that.\n\n        Beyond helping youths discover opportunities, I hope\n        we can empower them to take initiative, gain meaningful\n        experiences, and shape their own paths.\n\n        Ultimately, TeenLaunch is more than a platform to me;\n        it is a step towards a society where young people are\n        not merely waiting for opportunities, but are equipped\n        to recognise, pursue, and create them.\n      \u003c/blockquote\u003e\n\n      \u003cp\u003e\n        \u003ccite\u003e\u0026mdash; Zong Keren\u003c/cite\u003e\n      \u003c/p\u003e\n\n    \u003c/section\u003e\n\n  \u003c/main\u003e\n\n  \u003c!-- Authentication Navigation Script --\u003e\n  \n\n\u003c/body\u003e\n\u003c/html\u003e\n","name":"site\\pages\\founder-keren.html"},{"html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cbase href=\"file:///C:/Users/vivie/OneDrive%20-%20Singapore%20Polytechnic/iphone%20album/Documents/Startup%20KRZYVV/mobile%20app/site/pages/\"\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n  \u003ctitle\u003eVivienne Lau Xuan Ying | Meet the Founders | TeenLaunch\u003c/title\u003e\n  \u003cmeta name=\"description\" content=\"Meet Vivienne Lau Xuan Ying, Co-founder and Chief Technology Officer of TeenLaunch. Explore her background, aspirations, and what TeenLaunch means to her.\"\u003e\n  \n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900\u0026display=swap\" rel=\"stylesheet\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../style.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/theme.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/founders.css\"\u003e\n\u003clink rel=\"stylesheet\" href=\"../../mobile-pages.css\"\u003e\u003c/head\u003e\n\u003cbody\u003e\n  \u003cheader class=\"site-header\"\u003e\u003cnav class=\"navbar\" aria-label=\"Main navigation\"\u003e\u003ca class=\"brand\" href=\"../index.html\"\u003e\u003cimg class=\"brand-logo\" src=\"../assets/images/light_logo.png\" alt=\"\"\u003e\u003cspan\u003eTeenLaunch\u003csmall\u003eFuture founders start here\u003c/small\u003e\u003c/span\u003e\u003c/a\u003e\u003cdiv class=\"nav-links\"\u003e\u003ca href=\"about.html\"\u003eAbout us\u003c/a\u003e\u003ca class=\"auth-link\" href=\"auth.html\"\u003eLogin\u003c/a\u003e\u003c/div\u003e\u003c/nav\u003e\u003c/header\u003e\n  \u003cmain class=\"founder-main\"\u003e\n    \u003ca class=\"founder-breadcrumb\" href=\"about.html#founders\"\u003e\u0026larr; Meet our founders\u003c/a\u003e\n    \u003csection class=\"founder-hero\" aria-labelledby=\"founder-name\"\u003e\n      \u003cfigure class=\"founder-portrait founder-portrait-square\"\u003e\u003cimg src=\"../assets/images/founder-vivienne.jpeg\" alt=\"Vivienne Lau Xuan Ying in front of the Petronas Twin Towers\" width=\"1536\" height=\"2048\" style=\"object-position: center 65%\"\u003e\u003c/figure\u003e\n      \u003cdiv\u003e\u003cp class=\"founder-kicker\"\u003eThe people behind TeenLaunch\u003c/p\u003e\u003ch1 id=\"founder-name\"\u003eVivienne Lau Xuan Ying\u003c/h1\u003e\u003cp class=\"founder-role\"\u003eCo-founder \u0026middot; Chief Technology Officer (CTO), TeenLaunch\u003c/p\u003e\u003cdiv class=\"founder-email\"\u003e\u003cspan\u003eTeenLaunch email\u003c/span\u003e\u003cp class=\"founder-placeholder\"\u003e\u003ca href=\"mailto:vivienne@teenlaunch.app\"\u003evivienne@teenlaunch.app\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e\n    \u003csection class=\"founder-story\" aria-labelledby=\"background-heading\"\u003e\u003cp class=\"founder-kicker\"\u003e01 / My story\u003c/p\u003e\u003ch2 id=\"background-heading\"\u003eA little about me\u003c/h2\u003e\u003cp class=\"founder-placeholder\"\u003eI am an Information Technology student at Singapore Polytechnic, specialising in UX/UI Design, and a Product Engineer Intern at X Corp Edutech. My experience includes website and app development, user interface design, youth engagement and event planning. As a co-founder of TeenLaunch, I help turn our ideas into a platform that supports young people in discovering opportunities and building their portfolios.\u003c/p\u003e\u003c/section\u003e\n    \u003csection class=\"founder-story\" aria-labelledby=\"aspirations-heading\"\u003e\u003cp class=\"founder-kicker\"\u003e02 / Looking ahead\u003c/p\u003e\u003ch2 id=\"aspirations-heading\"\u003eWhat I\u0027m working towards\u003c/h2\u003e\u003cdiv class=\"founder-aspirations\"\u003e\u003carticle\u003e\u003cp class=\"founder-kicker\"\u003eRight now\u003c/p\u003e\u003ch3\u003ePresent aspirations\u003c/h3\u003e\u003cp class=\"founder-placeholder\"\u003eI want to make TeenLaunch useful and easy to use, helping youths explore their interests, gain experience and feel more confident about their next steps. Along the way, I hope to strengthen my skills in product development, design and leadership.\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cp class=\"founder-kicker\"\u003eThe next chapter\u003c/p\u003e\u003ch3\u003eFuture aspirations\u003c/h3\u003e\u003cp class=\"founder-placeholder\"\u003eI aspire to grow TeenLaunch into a trusted platform that helps young people discover opportunities and build their futures. As I gain experience through developing TeenLaunch, I hope to explore new business ideas and eventually become a serial entrepreneur, combining technology and design to create useful products.\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\u003c/section\u003e\n    \u003cnav class=\"founder-switcher\" aria-label=\"Founder profiles\"\u003e\u003ca href=\"founder-keren.html\"\u003eKeren\u003c/a\u003e\n\u003ca href=\"founder-ziying.html\"\u003eZiying\u003c/a\u003e\n\u003ca href=\"founder-vivienne.html\" aria-current=\"page\"\u003eVivienne\u003c/a\u003e\u003c/nav\u003e\n    \u003csection class=\"founder-answer\" aria-labelledby=\"meaning-heading\"\u003e\u003cp class=\"founder-kicker\"\u003eIn my own words\u003c/p\u003e\u003ch2 id=\"meaning-heading\"\u003eWhat does TeenLaunch mean to you?\u003c/h2\u003e\u003cblockquote\u003eTo me, TeenLaunch represents the courage to start, even when you do not have everything figured out. As a young person myself, I understand how difficult it can be to find opportunities and decide what comes next. TeenLaunch is my way of helping other youths take that first step while learning and growing alongside them.\u003c/blockquote\u003e\u003cp\u003e\u003ccite\u003e\u0026mdash; Vivienne Lau Xuan Ying\u003c/cite\u003e\u003c/p\u003e\u003c/section\u003e\n  \u003c/main\u003e\n  \n\u003c/body\u003e\n\u003c/html\u003e\n","name":"site\\pages\\founder-vivienne.html"},{"html":"\n\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cbase href=\"file:///C:/Users/vivie/OneDrive%20-%20Singapore%20Polytechnic/iphone%20album/Documents/Startup%20KRZYVV/mobile%20app/site/pages/\"\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n\n  \u003ctitle\u003eZhuo Ziying | Meet the Founders | TeenLaunch\u003c/title\u003e\n\n  \u003cmeta name=\"description\" content=\"Meet Zhuo Ziying, Co-founder and Chief Operating Officer of TeenLaunch. Discover her background, aspirations, and what TeenLaunch means to her.\"\u003e\n\n  \u003c!-- Theme Script --\u003e\n  \n\n  \u003c!-- Fonts --\u003e\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n  \u003c!-- Stylesheets --\u003e\n  \u003clink rel=\"stylesheet\" href=\"../style.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/theme.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/founders.css\"\u003e\n\u003clink rel=\"stylesheet\" href=\"../../mobile-pages.css\"\u003e\u003c/head\u003e\n\n\u003cbody\u003e\n\n  \u003c!-- Header --\u003e\n  \u003cheader class=\"site-header\"\u003e\n    \u003cnav class=\"navbar\" aria-label=\"Main navigation\"\u003e\n\n      \u003ca class=\"brand\" href=\"../index.html\"\u003e\n        \u003cimg\n          class=\"brand-logo\"\n          src=\"../assets/images/light_logo.png\"\n          alt=\"TeenLaunch Logo\"\n        \u003e\n        \u003cspan\u003e\n          TeenLaunch\n          \u003csmall\u003eFuture founders start here\u003c/small\u003e\n        \u003c/span\u003e\n      \u003c/a\u003e\n\n      \u003cdiv class=\"nav-links\"\u003e\n        \u003ca href=\"about.html\"\u003eAbout us\u003c/a\u003e\n        \u003ca class=\"auth-link\" href=\"auth.html\"\u003eLogin\u003c/a\u003e\n      \u003c/div\u003e\n\n    \u003c/nav\u003e\n  \u003c/header\u003e\n\n  \u003c!-- Main Content --\u003e\n  \u003cmain class=\"founder-main\"\u003e\n\n    \u003c!-- Back to Founders --\u003e\n    \u003ca class=\"founder-breadcrumb\" href=\"about.html#founders\"\u003e\n      \u0026larr; Meet our founders\n    \u003c/a\u003e\n\n    \u003c!-- Founder Profile --\u003e\n    \u003csection class=\"founder-hero\" aria-labelledby=\"founder-name\"\u003e\n\n      \u003cfigure class=\"founder-portrait\"\u003e\n        \u003cimg\n          src=\"../assets/images/ZY pic.png\"\n          alt=\"Portrait of Zhuo Ziying\"\n          width=\"640\"\n          height=\"800\"\n        \u003e\n      \u003c/figure\u003e\n\n      \u003cdiv\u003e\n        \u003cp class=\"founder-kicker\"\u003e\n          The people behind TeenLaunch\n        \u003c/p\u003e\n\n        \u003ch1 id=\"founder-name\"\u003eZhuo Ziying\u003c/h1\u003e\n\n        \u003cp class=\"founder-role\"\u003e\n          Co-founder \u0026middot; Chief Operating Officer (COO)\n        \u003c/p\u003e\n\n        \u003cdiv class=\"founder-email\"\u003e\n          \u003cspan\u003eTeenLaunch email\u003c/span\u003e\n          \u003cp\u003e\n            \u003ca href=\"mailto:ziying@teenlaunch.app\"\u003e\n              ziying@teenlaunch.app\n            \u003c/a\u003e\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n    \u003c/section\u003e\n\n    \u003c!-- Background --\u003e\n    \u003csection class=\"founder-story\" aria-labelledby=\"background-heading\"\u003e\n\n      \u003cp class=\"founder-kicker\"\u003e01 / My story\u003c/p\u003e\n\n      \u003ch2 id=\"background-heading\"\u003e\n        A little about me\n      \u003c/h2\u003e\n\n      \u003cp\u003e\n        I am a youth entrepreneur passionate about education,\n        technology, and creating meaningful opportunities for\n        young people. Through my experiences in student leadership\n        and entrepreneurship, I have developed a strong interest\n        in empowering youths to take initiative, explore their\n        interests, and pursue their aspirations.\n      \u003c/p\u003e\n\n    \u003c/section\u003e\n\n    \u003c!-- Present and Future Aspirations --\u003e\n    \u003csection class=\"founder-story\" aria-labelledby=\"aspirations-heading\"\u003e\n\n      \u003cp class=\"founder-kicker\"\u003e02 / Looking ahead\u003c/p\u003e\n\n      \u003ch2 id=\"aspirations-heading\"\u003e\n        What I\u0027m working towards\n      \u003c/h2\u003e\n\n      \u003cdiv class=\"founder-aspirations\"\u003e\n\n        \u003c!-- Present Aspirations --\u003e\n        \u003carticle\u003e\n          \u003cp class=\"founder-kicker\"\u003eRight now\u003c/p\u003e\n\n          \u003ch3\u003ePresent aspirations\u003c/h3\u003e\n\n          \u003cp\u003e\n            As COO of TeenLaunch, I focus on turning our team\u0027s\n            vision into reality by overseeing operations,\n            coordinating initiatives, and building partnerships\n            that support the platform\u0027s growth.\n          \u003c/p\u003e\n        \u003c/article\u003e\n\n        \u003c!-- Future Aspirations --\u003e\n        \u003carticle\u003e\n          \u003cp class=\"founder-kicker\"\u003eThe next chapter\u003c/p\u003e\n\n          \u003ch3\u003eFuture aspirations\u003c/h3\u003e\n\n          \u003cp\u003e\n            Looking ahead, I hope to expand TeenLaunch into a\n            trusted youth opportunity ecosystem that makes\n            opportunities more accessible to everyone,\n            regardless of their background.\n          \u003c/p\u003e\n        \u003c/article\u003e\n\n      \u003c/div\u003e\n\n    \u003c/section\u003e\n\n    \u003c!-- Founder Navigation --\u003e\n    \u003cnav class=\"founder-switcher\" aria-label=\"Founder profiles\"\u003e\n\n      \u003ca href=\"founder-keren.html\"\u003e\n        Keren\n      \u003c/a\u003e\n\n      \u003ca href=\"founder-ziying.html\" aria-current=\"page\"\u003e\n        Ziying\n      \u003c/a\u003e\n\n      \u003ca href=\"founder-vivienne.html\"\u003e\n        Vivienne\n      \u003c/a\u003e\n\n    \u003c/nav\u003e\n\n    \u003c!-- What TeenLaunch Means to Me --\u003e\n    \u003csection class=\"founder-answer\" aria-labelledby=\"meaning-heading\"\u003e\n\n      \u003cp class=\"founder-kicker\"\u003e\n        In my own words\n      \u003c/p\u003e\n\n      \u003ch2 id=\"meaning-heading\"\u003e\n        What does TeenLaunch mean to you?\n      \u003c/h2\u003e\n\n      \u003cblockquote\u003e\n        To me, TeenLaunch is more than just a platform — it is\n        a commitment to helping young people discover what they\n        are capable of. I believe that every student deserves\n        the opportunity to explore their interests, develop\n        their potential, and take their first steps towards\n        their aspirations.\n\n        Through TeenLaunch, I hope to bridge the gap between\n        young people and the opportunities available to them,\n        so that no one has to miss out simply because they\n        did not know where to look.\n\n        Ultimately, TeenLaunch represents our belief that\n        young people should not have to wait for opportunities\n        to come to them; they should be empowered to seek\n        them out and create their own.\n      \u003c/blockquote\u003e\n\n      \u003cp\u003e\n        \u003ccite\u003e\u0026mdash; Zhuo Ziying\u003c/cite\u003e\n      \u003c/p\u003e\n\n    \u003c/section\u003e\n\n  \u003c/main\u003e\n\n  \u003c!-- Authentication Navigation Script --\u003e\n  \n\n\u003c/body\u003e\n\u003c/html\u003e\n","name":"site\\pages\\founder-ziying.html"},{"html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cbase href=\"file:///C:/Users/vivie/OneDrive%20-%20Singapore%20Polytechnic/iphone%20album/Documents/Startup%20KRZYVV/mobile%20app/site/pages/\"\u003e\n  \u003cmeta charset=\"UTF-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n  \u003cmeta name=\"description\" content=\"TeenLaunch help centre, user manual, and frequently asked questions.\"\u003e\n  \u003ctitle\u003eTeenLaunch | Help \u0026amp; User Manual\u003c/title\u003e\n  \n  \n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900\u0026display=swap\" rel=\"stylesheet\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../style.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/theme.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/settings.css\"\u003e\n  \u003clink rel=\"stylesheet\" href=\"../css/help.css\"\u003e\n\u003clink rel=\"stylesheet\" href=\"../../mobile-pages.css\"\u003e\u003c/head\u003e\n\u003cbody\u003e\n  \u003cheader class=\"site-header\"\u003e\n    \u003cnav class=\"navbar\" aria-label=\"Main navigation\"\u003e\n      \u003ca class=\"brand\" href=\"../index.html\"\u003e\u003cimg class=\"brand-logo\" src=\"../assets/images/light_logo.png\" alt=\"\"\u003e\u003cspan\u003eTeenLaunch\u003csmall\u003eHelp centre\u003c/small\u003e\u003c/span\u003e\u003c/a\u003e\n      \u003cbutton class=\"nav-toggle\" type=\"button\" aria-label=\"Open navigation\" aria-expanded=\"false\"\u003e\u003cspan\u003e\u003c/span\u003e\u003cspan\u003e\u003c/span\u003e\u003cspan\u003e\u003c/span\u003e\u003c/button\u003e\n      \u003cdiv class=\"nav-links\"\u003e\u003ca href=\"../index.html\"\u003eHome\u003c/a\u003e\u003ca class=\"auth-link\" href=\"auth.html\"\u003eLogin\u003c/a\u003e\u003c/div\u003e\n    \u003c/nav\u003e\n  \u003c/header\u003e\n  \u003cmain class=\"help-main\"\u003e\n    \u003csection class=\"help-hero\"\u003e\n      \u003cdiv\u003e\u003cp class=\"eyebrow\"\u003eTeenLaunch Help Centre\u003c/p\u003e\u003ch1\u003eStart confidently. Find answers quickly.\u003c/h1\u003e\u003cp\u003eThis guide covers account setup, opportunities, Career DNA, planning, community, privacy, and troubleshooting.\u003c/p\u003e\u003c/div\u003e\n      \u003caside class=\"manual-card\"\u003e\u003cspan\u003eUpdated edition - August 2026\u003c/span\u003e\u003ch2\u003eTeenLaunch User Manual\u003c/h2\u003e\u003cp\u003eA printable guide covering the latest mobile navigation, reminders, planning, XP, portfolio, inbox, language, partner, and account features.\u003c/p\u003e\u003ca class=\"btn primary\" href=\"../output/pdf/TeenLaunch-User-Manual.pdf\" download\u003eDownload PDF manual\u003c/a\u003e\u003c/aside\u003e\n    \u003c/section\u003e\n    \u003csection class=\"quick-start\" aria-labelledby=\"quick-start-title\"\u003e\u003cp class=\"eyebrow\"\u003eFirst 10 minutes\u003c/p\u003e\u003ch2 id=\"quick-start-title\"\u003eYour quickest route to value\u003c/h2\u003e\u003col\u003e\u003cli\u003eCreate an account and confirm your profile details.\u003c/li\u003e\u003cli\u003eComplete Career DNA to improve recommendations.\u003c/li\u003e\u003cli\u003eBrowse or search opportunities and check eligibility.\u003c/li\u003e\u003cli\u003eSave promising options, then apply before the official deadline.\u003c/li\u003e\u003cli\u003eAdd goals in Life Planner and evidence in your portfolio.\u003c/li\u003e\u003c/ol\u003e\u003c/section\u003e\n    \u003csection class=\"faq-section\" aria-labelledby=\"faq-title\"\u003e\u003cp class=\"eyebrow\"\u003eQuestions \u0026amp; answers\u003c/p\u003e\u003ch2 id=\"faq-title\"\u003eFrequently asked questions\u003c/h2\u003e\u003cdiv class=\"faq-list\"\u003e\n      \u003cdetails open\u003e\u003csummary\u003eWho can use TeenLaunch?\u003c/summary\u003e\u003cp\u003eTeenLaunch is designed primarily for young people aged 10-24. Parents, educators, opportunity partners, and authorised administrators may also use relevant parts of the platform.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eDo I need an account to browse?\u003c/summary\u003e\u003cp\u003eYou can view public pages and opportunities without signing in. An account is required to save opportunities, apply through TeenLaunch, receive personalised recommendations, use planning and social features, and build a portfolio.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow do recommendations work?\u003c/summary\u003e\u003cp\u003eComplete your profile and Career DNA test. TeenLaunch compares your strengths and eligibility information with opportunity metadata. A match is guidance, not a guarantee of acceptance or suitability.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow do I apply for an opportunity?\u003c/summary\u003e\u003cp\u003eOpen the opportunity details, check age, education, location, and deadline, then select Apply. Some opportunities use a TeenLaunch application form; others send you to the organiser\u0027s official page.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eDoes saving an opportunity submit an application?\u003c/summary\u003e\u003cp\u003eNo. Saving only bookmarks it. Your application is submitted only after you complete the application flow and receive confirmation.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow can I tell whether an opportunity is trustworthy?\u003c/summary\u003e\u003cp\u003eReview the organiser, source label, eligibility, deadline, costs, and official link. TeenLaunch review signals reduce risk but do not replace your own checks. Never send passwords, one-time codes, or unexpected payments.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eWhat is a verified portfolio?\u003c/summary\u003e\u003cp\u003eYour portfolio combines official completion records with reflections and projects you control. Official records remain locked. You choose whether the portfolio is public and can copy its public link from the builder.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eCan I change or retake Career DNA?\u003c/summary\u003e\u003cp\u003eYes. Open Settings, choose Personality Test, and use the retake option. Updated results may change your recommendations.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow do I change language or appearance?\u003c/summary\u003e\u003cp\u003eUse the language button in the navigation for supported bilingual content. Open Settings and Display Settings to switch the visual theme.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eWhat should I do if a page will not load?\u003c/summary\u003e\u003cp\u003eCheck your connection, refresh once, and sign in again if your session expired. Try a current version of Chrome, Edge, Safari, or Firefox. If the issue continues, note the page and error and email support.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow do I protect my privacy?\u003c/summary\u003e\u003cp\u003eUse a unique password, keep login codes private, and avoid posting personal addresses, phone numbers, schedules, or identity documents. Make a portfolio public only when you are comfortable sharing its contents.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow do partners submit opportunities?\u003c/summary\u003e\u003cp\u003eSign in, open Submit an Opportunity from the Opportunities menu, enter accurate organiser and opportunity details, and submit for admin review. Submission does not guarantee publication.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow can I get more help or report a concern?\u003c/summary\u003e\u003cp\u003eEmail \u003ca href=\"mailto:vivienne@teenlaunch.app\"\u003evivienne@teenlaunch.app\u003c/a\u003e. Include the page, what you expected, what happened, and a screenshot without passwords or sensitive personal data. For an immediate safety concern, stop contact with the organiser and tell a trusted adult.\u003c/p\u003e\u003c/details\u003e\n    \u003c/div\u003e\u003c/section\u003e\n    \u003csection class=\"support-card\"\u003e\u003cdiv\u003e\u003cp class=\"eyebrow\"\u003eStill need help?\u003c/p\u003e\u003ch2\u003eWe want every next step to feel clear.\u003c/h2\u003e\u003cp\u003eContact TeenLaunch support at \u003cstrong\u003evivienne@teenlaunch.app\u003c/strong\u003e and include enough detail for the team to reproduce the issue.\u003c/p\u003e\u003cp class=\"support-copy-status\" data-support-copy-status aria-live=\"polite\"\u003e\u003c/p\u003e\u003c/div\u003e\u003cbutton class=\"btn support-copy-button\" type=\"button\" data-copy-support-email\u003eCopy support email\u003c/button\u003e\u003c/section\u003e\n  \u003c/main\u003e\n  \u003cfooter class=\"footer\"\u003e\u003cp\u003e\u0026copy; 2026 TeenLaunch\u003c/p\u003e\u003ca href=\"../index.html\" data-i18n=\"Home\"\u003eHome\u003c/a\u003e\u003ca href=\"../output/pdf/TeenLaunch-User-Manual.pdf\" data-i18n=\"User manual (PDF)\"\u003eUser manual (PDF)\u003c/a\u003e\u003ca href=\"mailto:vivienne@teenlaunch.app\" data-i18n=\"Support\"\u003eSupport\u003c/a\u003e\u003c/footer\u003e\n  \n\u003c/body\u003e\n\u003c/html\u003e\n","name":"site\\pages\\help.html"},{"html":"\u003c!DOCTYPE html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cbase href=\"file:///C:/Users/vivie/OneDrive%20-%20Singapore%20Polytechnic/iphone%20album/Documents/Startup%20KRZYVV/mobile%20app/site/pages/\"\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003cmeta name=\"viewport\" co y\"\u003e\u003coption value=\"school\"\u003eSchool\u003c/option\u003e\u003coption value=\"study\"\u003eStudy\u003c/option\u003e\u003coption value=\"cca\"\u003eCCA\u003c/option\u003e\u003coption value=\"tuition\"\u003eTuition\u003c/option\u003e\u003coption value=\"opportunity\"\u003eOpportunity\u003c/option\u003e\u003coption value=\"personal\"\u003ePersonal\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003clabel\u003ePriority\u003cselect name=\"priority\"\u003e\u003coption value=\"low\"\u003eLow\u003c/option\u003e\u003coption value=\"medium\" selected\u003eMedium\u003c/option\u003e\u003coption value=\"high\"\u003eHigh\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\u003c/div\u003e\n            \u003clabel\u003eNotes\u003ctextarea name=\"description\" rows=\"2\" maxlength=\"1000\"\u003e\u003c/textarea\u003e\u003c/label\u003e\n            \u003cdiv class=\"two-fields\"\u003e\u003clabel\u003eStart\u003cinput name=\"start_time\" type=\"datetime-local\"\u003e\u003c/label\u003e\u003clabel\u003eEnd\u003cinput name=\"end_time\" type=\"datetime-local\"\u003e\u003c/label\u003e\u003c/div\u003e\n            \u003cdiv class=\"two-fields\"\u003e\u003clabel\u003eDeadline\u003cinput name=\"deadline\" type=\"date\"\u003e\u003c/label\u003e\u003clabel\u003eTime needed\u003cinput name=\"estimated_minutes\" type=\"number\" min=\"20\" max=\"1440\" step=\"5\" value=\"45\"\u003e\u003c/label\u003e\u003c/div\u003e\n            \u003clabel\u003eRepeat\u003cselect name=\"recurrence\"\u003e\u003coption value=\"none\"\u003eDoes not repeat\u003c/option\u003e\u003coption value=\"daily\"\u003eDaily\u003c/option\u003e\u003coption value=\"weekly\"\u003eWeekly\u003c/option\u003e\u003c/select\u003e\u003c/label\u003e\n            \u003cbutton class=\"btn primary\" type=\"submit\" data-task-submit\u003eAdd task\u003c/button\u003e\n            \u003cp class=\"task-confirmation\" data-task-confirmation role=\"status\" aria-live=\"polite\" hidden\u003e\u003c/p\u003e\n          \u003c/form\ g\" alt=\"\" aria-hidden=\"true\"\u003e\n        \u003c/a\u003e\n      \u003c/div\u003e\n    \u003c/nav\u003e\n  \u003c/header\u003e\n\n  \u003cmain\u003e\n    \u003csection class=\"hero section\"\u003e\n      \u003cdiv class=\"reveal\"\u003e\n        \u003cp class=\"eyebrow\"\u003eResources\u003c/p\u003e\n        \u003ch1\u003eLearn faster with workshops, showcases, and practical guides.\u003c/h1\u003e\n        \u003cp\u003eUse TeenLaunch resources to prepare for opportunities, sharpen pitches, improve presentations, and learn from past youth projects.\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"resource-card reveal\"\u003e\n        \u003cp class=\"eyebrow\"\u003eNext workshop\u003c/p\u003e\n        \u003ch2\u003ePitching 101\u003c/h2\u003e\n        \u003cp\u003eBuild a clear problem, solution, proof, impact, and ask in one practice session.\u003c/p\u003e\n        \u003ca class=\"btn primary\" href=\"#calendar\"\u003eView Calendar\u003c/a\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section\"\u003e\n      \u003cdiv class=\"section-heading reveal\"\u003e\n        \u003cp class=\"eyebrow\"\u003eResource Library\u003c/p\u003e\n        \u003ch2\u003eEverything students need before they apply, compete, or present.\u003c/h2\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"resource-grid\"\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003eWorkshops\u003c/h3\u003e\u003cp\u003eBeginner sessions on entrepreneurship, ideation, public speaking, innovation, and project planning.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003eUpcoming Events\u003c/h3\u003e\u003cp\u003eShortlist upcoming talks, bootcamps, showcases, and practice sessions for ages 10-24.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003ePast User Showcase\u003c/h3\u003e\u003cp\u003eSee student projects, pitch decks, prototypes, campaigns, and community ideas.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003eWinning Teams/Projects\u003c/h3\u003e\u003cp\u003eLearn what strong youth teams did well: clear problem, evidence, teamwork, and delivery.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003eInspiration Section\u003c/h3\u003e\u003cp\u003ePrompts, founder stories, innovation themes, and examples to spark new ideas.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003ePitching Tips\u003c/h3\u003e\u003cp\u003eKeep it simple: problem, audience, solution, traction, impact, and one specific ask.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003ePresentation Advice\u003c/h3\u003e\u003cp\u003eUse fewer words, stronger visuals, calm pacing, and rehearsal under time limits.\u003c/p\u003e\u003c/article\u003e\n        \u003carticle class=\"resource-card reveal\"\u003e\u003ch3\u003eUser Guide\u003c/h3\u003e\u003cp\u003eLearn how to set up your profile, discover opportunities, apply, plan, connect, and build a verified portfolio.\u003c/p\u003e\u003ca class=\"btn secondary\" href=\"help.html\"\u003eOpen Help \u0026amp; Q\u0026amp;A\u003c/a\u003e\u003c/article\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"section calendar-section\" id=\"calendar\"\u003e\n      \u003cdiv class=\"calendar reveal\"\u003e\n        \u003cp class=\"eyebrow\"\u003eEvent Calendar\u003c/p\u003e\n        \u003ch2\u003eUpcoming\u003c/h2\u003e\n        \u003cdiv class=\"calendar-row\"\u003e\u003cspan\u003eJul 06\u003c/span\u003e\u003cp\u003ePitching 101 workshop\u003c/p\u003e\u003c/div\u003e\n        \u003cdiv class=\"calendar-row\"\u003e\u003cspan\u003eJul 18\u003c/span\u003e\u003cp\u003eInnovation idea sprint\u003c/p\u003e\u003c/div\u003e\n        \u
