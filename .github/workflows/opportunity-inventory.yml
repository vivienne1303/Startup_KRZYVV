name: Daily opportunity refresh

on:
  schedule:
    # 09:00 Singapore primary; 12:00, 15:00, 18:00, 21:00, 23:00 recovery.
    # Every run shares the same daily quota and resumes only the shortfall.
    - cron: '0 1,4,7,10,13,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test opportunity rules
        run: node --test opportunity-automation/*.test.mjs

      - name: Check database connection settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo '::error::Add SUPABASE_URL and SUPABASE_SECRET_KEY in repository Actions secrets before activation.'
            exit 1
          fi

      - name: Archive outdated listings and add at least 50 new opportunities today
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node opportunity-automation/refresh.mjs --apply --minimum-additions=50

      - name: Show actual daily additions and removals
        if: always()
        run: node opportunity-automation/write-summary.mjs

      - name: Save inventory summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-refresh-${{ github.run_id }}
          path: opportunity-automation/reports/**/summary.json
          if-no-files-found: warn
          retention-days: 30
